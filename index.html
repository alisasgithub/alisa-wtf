<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alisa.wtf</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f7f3e8;
      color: #30283b;
      font-family: "Press Start 2P", monospace;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 8vw, 4rem);
      font-weight: normal;
    }
    #cat {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    canvas { display: block; width: 48px; height: 40px; image-rendering: pixelated; }
    #meow {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px;
      border: 2px solid #30283b;
      background: #fffaf1;
      font-size: 8px;
    }
    #meow::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 45%;
      border: 4px solid transparent;
      border-top-color: #30283b;
    }
    #cat.below #meow { bottom: auto; top: 100%; }
    #cat.below #meow::after {
      top: auto;
      bottom: 100%;
      border-top-color: transparent;
      border-bottom-color: #30283b;
    }
  </style>
</head>
<body>
  <main><h1>alisa.wtf</h1></main>
  <div id="cat" aria-hidden="true">
    <span id="meow" hidden>meow</span>
    <canvas width="24" height="20"></canvas>
  </div>
  <script>
    const cat = document.querySelector("#cat");
    const bubble = document.querySelector("#meow");
    const canvas = cat.querySelector("canvas");
    const pixels = canvas.getContext("2d");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const colors = { x: "#30283b", o: "#786187", p: "#edabc0" };
    const head = [
      "..........xx.....xx.....",
      "..........xox...xox.....",
      "..........xoox.xoox.....",
      "..........xooooooox.....",
      ".........xooooooooox....",
      ".........xooxoooxoox....",
      ".........xooopppooox...."
    ];
    const sitting = [
      ".........xxooopooxx.....",
      "........xoooooooox......",
      ".......xooooooooox......",
      "..xx...xooooooooox......",
      ".xoox..xooooooooox......",
      "..xooxxooooooooooox.....",
      "...xxooooooooooooox.....",
      ".....xxxxxxxxxxxxxx....."
    ];
    const hopping = [
      "....xx...xxooopooxx.....",
      "...xooxxxoooooooox......",
      ".xxoooooooooooooox......",
      "...xooooooooooooox......",
      "....xxxxxxxxxxxxxx......",
      "......xoox....xoox......",
      ".......xx......xx.......",
      "........................"
    ];

    let x = innerWidth / 2;
    let y = innerHeight / 2 + 72;
    let targetX = x;
    let targetY = y;
    let facing = 1;
    let frame = 0;
    let previousTime;
    let phase = 0;
    let hasTarget = false;

    function draw(moving, lift = 0) {
      pixels.clearRect(0, 0, canvas.width, canvas.height);
      [...head, ...(moving ? hopping : sitting)].forEach((row, rowIndex) => {
        [...row].forEach((pixel, column) => {
          if (pixel === ".") return;
          pixels.fillStyle = colors[pixel];
          pixels.fillRect(facing > 0 ? column : 23 - column, rowIndex + 5, 1, 1);
        });
      });
      cat.style.transform = `translate(${Math.round(x - 24)}px, ${Math.round(y - 40 - lift)}px)`;
      cat.classList.toggle("below", y < 75);
      bubble.hidden = moving || !hasTarget;
    }

    function aim(clientX, clientY) {
      const edge = 30;
      targetX = Math.max(edge, Math.min(innerWidth - edge, clientX));
      targetY = Math.max(42, Math.min(innerHeight - 22, clientY));
    }

    function tick(time) {
      const elapsed = previousTime === undefined ? 0 : Math.min(time - previousTime, 32);
      previousTime = time;
      const dx = targetX - x;
      const dy = targetY - y;
      const distance = Math.hypot(dx, dy);
      if (Math.abs(dx) > 1) facing = Math.sign(dx);

      const step = reducedMotion.matches ? distance : elapsed * 0.29;
      if (distance <= Math.max(step, 1)) {
        x = targetX;
        y = targetY;
        frame = 0;
        previousTime = undefined;
        phase = 0;
        draw(false);
        return;
      }

      x += dx / distance * step;
      y += dy / distance * step;
      phase = (phase + elapsed / 260) % 1;
      draw(true, Math.sin(phase * Math.PI) * 17);
      frame = requestAnimationFrame(tick);
    }

    function chase(event) {
      hasTarget = true;
      aim(event.clientX, event.clientY);
      if (Math.hypot(targetX - x, targetY - y) > 1) bubble.hidden = true;
      if (!frame) frame = requestAnimationFrame(tick);
    }

    addEventListener("pointermove", event => {
      if (event.pointerType !== "touch") chase(event);
    });
    addEventListener("pointerdown", chase);
    addEventListener("resize", () => {
      aim(hasTarget ? targetX : innerWidth / 2, hasTarget ? targetY : innerHeight / 2 + 72);
      x = targetX;
      y = targetY;
      draw(false);
    });

    aim(x, y);
    x = targetX;
    y = targetY;
    draw(false);
  </script>
</body>
</html>
